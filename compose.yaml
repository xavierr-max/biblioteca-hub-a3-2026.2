services:
  mysql:
    image: mysql:8.4
    container_name: biblioteca-gestao-mysql
    restart: unless-stopped
    env_file: [.env]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biblioteca}
      MYSQL_USER: ${MYSQL_USER:-biblioteca_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: [biblioteca_mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  biblioteca_mysql_data:
