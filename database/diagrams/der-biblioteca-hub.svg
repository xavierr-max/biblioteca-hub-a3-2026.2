<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<rect width="1800" height="1200" fill="#f7fafc"/><style>.t{font:700 30px Arial;fill:#17324d}.s{font:16px Arial;fill:#4a5568}.b{fill:#fff;stroke:#1f5f8b;stroke-width:2}.h{fill:#1f5f8b}.a{fill:#fffaf0;stroke:#c58a19;stroke-width:2}.ah{fill:#c58a19}.n{font:700 17px Arial;fill:#fff}.f{font:14px Consolas,monospace;fill:#243b53}.r{stroke:#687b8c;stroke-width:2;fill:none}.c{font:700 13px Arial;fill:#334e68}</style>
<text x="55" y="50" class="t">DER - Biblioteca Hub</text><text x="55" y="78" class="s">Modelo físico correspondente ao schema MySQL implementado | PK chave primária | FK chave estrangeira | UK único</text>
<g transform="translate(60 130)"><rect width="250" height="120" class="b"/><rect width="250" height="32" class="h"/><text x="12" y="22" class="n">Categories</text><text x="12" y="55" class="f">PK CategoryId BIGINT</text><text x="12" y="77" class="f">UK Name VARCHAR(100)</text><text x="12" y="99" class="f">IsActive, CreatedAt</text></g>
<g transform="translate(60 350)"><rect width="250" height="98" class="b"/><rect width="250" height="32" class="h"/><text x="12" y="22" class="n">Publishers</text><text x="12" y="55" class="f">PK PublisherId BIGINT</text><text x="12" y="77" class="f">UK Name, CreatedAt</text></g>
<g transform="translate(60 550)"><rect width="250" height="98" class="b"/><rect width="250" height="32" class="h"/><text x="12" y="22" class="n">Genres</text><text x="12" y="55" class="f">PK GenreId BIGINT</text><text x="12" y="77" class="f">UK Name, CreatedAt</text></g>
<g transform="translate(390 270)"><rect width="330" height="164" class="b"/><rect width="330" height="32" class="h"/><text x="12" y="22" class="n">Books</text><text x="12" y="55" class="f">PK BookId BIGINT</text><text x="12" y="77" class="f">Title, UK Isbn13</text><text x="12" y="99" class="f">FK CategoryId, FK PublisherId</text><text x="12" y="121" class="f">IsArchived, CreatedAt</text><text x="12" y="143" class="f">UpdatedAt</text></g>
<g transform="translate(800 120)"><rect width="260" height="98" class="b"/><rect width="260" height="32" class="h"/><text x="12" y="22" class="n">Authors</text><text x="12" y="55" class="f">PK AuthorId BIGINT</text><text x="12" y="77" class="f">UK Name, CreatedAt</text></g>
<g transform="translate(800 300)"><rect width="260" height="76" class="a"/><rect width="260" height="32" class="ah"/><text x="12" y="22" class="n">BookAuthors</text><text x="12" y="55" class="f">PK/FK BookId + AuthorId</text></g>
<g transform="translate(1160 300)"><rect width="260" height="76" class="a"/><rect width="260" height="32" class="ah"/><text x="12" y="22" class="n">BookGenres</text><text x="12" y="55" class="f">PK/FK BookId + GenreId</text></g>
<g transform="translate(390 620)"><rect width="330" height="120" class="b"/><rect width="330" height="32" class="h"/><text x="12" y="22" class="n">Copies</text><text x="12" y="55" class="f">PK CopyId; FK BookId</text><text x="12" y="77" class="f">UK InventoryCode</text><text x="12" y="99" class="f">Status, CreatedAt</text></g>
<g transform="translate(800 620)"><rect width="300" height="120" class="b"/><rect width="300" height="32" class="h"/><text x="12" y="22" class="n">Readers</text><text x="12" y="55" class="f">PK ReaderId; FullName</text><text x="12" y="77" class="f">UK RegistrationNumber</text><text x="12" y="99" class="f">IsSuspended, CreatedAt</text></g>
<g transform="translate(1190 580)"><rect width="310" height="142" class="b"/><rect width="310" height="32" class="h"/><text x="12" y="22" class="n">Loans</text><text x="12" y="55" class="f">PK LoanId; FK CopyId</text><text x="12" y="77" class="f">FK ReaderId</text><text x="12" y="99" class="f">LoanedAt, DueAt</text><text x="12" y="121" class="f">ReturnedAt NULL</text></g>
<g transform="translate(620 900)"><rect width="300" height="120" class="b"/><rect width="300" height="32" class="h"/><text x="12" y="22" class="n">Reservations</text><text x="12" y="55" class="f">PK ReservationId</text><text x="12" y="77" class="f">FK BookId, FK ReaderId</text><text x="12" y="99" class="f">ReservedAt, Status</text></g>
<g transform="translate(1190 900)"><rect width="310" height="120" class="b"/><rect width="310" height="32" class="h"/><text x="12" y="22" class="n">Fines</text><text x="12" y="55" class="f">PK FineId; UK/FK LoanId</text><text x="12" y="77" class="f">Amount, Reason</text><text x="12" y="99" class="f">CreatedAt, PaidAt</text></g>
