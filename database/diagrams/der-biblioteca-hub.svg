<rect x="60" y="1080" width="1440" height="60" rx="8" fill="#edf2f7" stroke="#9fb3c8"/><text x="80" y="1106" class="s">BookAuthors e BookGenres resolvem os relacionamentos N:N. Loans preserva histórico; ativo = ReturnedAt IS NULL.</text><text x="80" y="1128" class="s">Fines.LoanId é único: cada empréstimo pode gerar no máximo uma multa.</text>
